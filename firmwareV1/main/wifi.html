<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่า Wi-Fi สำหรับ ESP32</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background-color: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        select, input { 
            width: 90%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 16px;
            box-sizing: border-box;
        }
        select {
            cursor: pointer;
            background-color: #fff;
        }
        button { 
            width: 95%; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        #statusMessage { margin-top: 15px; font-weight: bold; color: #007bff; font-size: 14px;}
        .refresh-btn {
            background-color: transparent;
            color: #007bff;
            border: 1px solid #007bff;
            width: auto;
            padding: 6px 12px;
            font-size: 14px;
            margin: 0 0 10px 0;
        }
        .refresh-btn:hover { background-color: #e6f2ff; }
    </style>
</head>
<body>

    <div class="container">
        <h2>เชื่อมต่อเครือข่าย Wi-Fi</h2>
        
        <button class="refresh-btn" type="button" onclick="scanWifi()">🔄 สแกนหา Wi-Fi</button>
        
        <form id="wifiForm">
            <select id="ssid" required>
                <option value="">-- กำลังค้นหา Wi-Fi ⏳ --</option>
            </select>
            
            <input type="password" id="password" placeholder="รหัสผ่าน Wi-Fi (เว้นว่างได้ถ้าไม่มี)">
            <button type="submit" id="submitBtn" disabled>เชื่อมต่อ Wi-Fi</button>
        </form>

        <p id="statusMessage"></p>
    </div>

    <script>
        const ssidSelect = document.getElementById('ssid');
        const submitBtn = document.getElementById('submitBtn');
        const statusText = document.getElementById('statusMessage');

        // ฟังก์ชันไปดึงข้อมูลจาก ESP32
        async function scanWifi() {
            ssidSelect.innerHTML = '<option value="">-- กำลังค้นหา Wi-Fi ⏳ --</option>';
            ssidSelect.disabled = true;
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/scan');
                const networks = await response.json();
                
                // ตัดชื่อซ้ำออก
                const uniqueNetworks = [...new Set(networks)];
                
                ssidSelect.innerHTML = '<option value="">-- กรุณาเลือก Wi-Fi --</option>';
                
                if (uniqueNetworks.length === 0) {
                    ssidSelect.innerHTML = '<option value="">ไม่พบ Wi-Fi บริเวณนี้</option>';
                } else {
                    uniqueNetworks.forEach(ssid => {
                        const option = document.createElement('option');
                        option.value = ssid;
                        option.textContent = ssid;
                        ssidSelect.appendChild(option);
                    });
                    ssidSelect.disabled = false;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                ssidSelect.innerHTML = '<option value="">❌ สแกนล้มเหลว กรุณาลองใหม่</option>';
                ssidSelect.disabled = false;
            }
        }

        // สั่งสแกนทันทีที่เปิดหน้าเว็บ
        window.onload = scanWifi;

        // ฟังก์ชันส่งรหัสผ่าน (เหมือนของคุณเดิมเป๊ะๆ)
        document.getElementById('wifiForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            var ssid = document.getElementById('ssid').value;
            var password = document.getElementById('password').value;

            statusText.style.color = "#007bff";
            statusText.innerHTML = "กำลังส่งข้อมูลไปยังบอร์ด...";

            fetch('/connect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'ssid=' + encodeURIComponent(ssid) + '&password=' + encodeURIComponent(password)
            })
            .then(response => response.text())
            .then(data => {
                // 🟢 สีเขียวถ้าส่งคำสั่งสำเร็จ
                statusText.style.color = "#28a745"; 
                statusText.innerHTML = data; 
            })
            .catch(error => {
                statusText.style.color = "red";
                statusText.innerHTML = "❌ ไม่สามารถส่งคำสั่งเชื่อมต่อได้";
            });
        });
    </script>

</body>
</html>
