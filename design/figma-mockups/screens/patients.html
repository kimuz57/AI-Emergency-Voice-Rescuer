<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Patients — ข้อมูลผู้ป่วย</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* Page-specific values from app/patients/page.tsx and components/PatientFormModal.tsx */
  .page-head .h1 { margin-top: 4px; line-height: 32px; }
  .page-head .sub { margin-top: 4px; line-height: 20px; }
  .page-head .eyebrow { line-height: 16px; }

  .pt-table table { font-size: 14px; line-height: 20px; }
  .pt-table th { line-height: 16px; white-space: nowrap; }
  .pt-table td { padding: 16px 20px; }
  .pt-table .avatar { font-size: 12px; font-weight: 700; }
  .pt-table .name { font-weight: 600; color: var(--text); }
  .pt-table .badge { padding: 2px 10px; line-height: 16px; gap: 0; }
  .pt-table .dev { display: flex; flex-direction: column; align-items: flex-start; font-size: 12px; line-height: 16px; }
  .pt-table .cell-actions { display: flex; justify-content: flex-end; gap: 8px; white-space: nowrap; }

  /* btnSecondary in page.tsx: h-9 px-3 gap-1.5, --tb-border, no shadow */
  .tb-btn-sec {
    height: 36px; padding: 0 12px; gap: 6px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 14px; font-weight: 600; box-shadow: none;
  }
  .tb-btn-sec.danger { color: var(--danger-text); }
  .btn-primary.add { gap: 8px; }

  /* Edit modal */
  .overlay { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 24px 16px; }
  .dialog { border: 1px solid var(--border); display: flex; flex-direction: column; }
  .dialog-head { padding: 16px 24px; align-items: flex-start; gap: 12px; }
  .dialog-head .t { font-size: 18px; font-weight: 700; line-height: 28px; }
  .dialog-head .s { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--muted); }
  .dialog-head .icon-btn { margin-right: -6px; flex: none; }
  .dialog-body { padding: 20px 24px; gap: 16px; }
  .dialog-body .field { gap: 6px; }
  .dialog-body .field label { font-size: 14px; font-weight: 600; line-height: 20px; color: var(--text); }
  .dialog-body .req { color: var(--danger-text); }
  .dialog-body .input { border-color: var(--border); font-size: 14px; padding: 0 12px; }
  .dialog-body .input.focus { border-color: var(--primary); box-shadow: var(--shadow-xs), 0 0 0 4px rgba(6, 111, 209, 0.25); }
  .dialog-body .input.select { padding-right: 12px; }
  .dialog-body .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .dev-box { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 16px; }
  .dev-box .lbl { margin-bottom: 8px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); }
  .dev-box .line { display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 4px; font-size: 14px; line-height: 20px; }
  .dev-box .hint2 { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .dialog-foot { padding: 16px 24px; gap: 12px; }
  .dialog-foot .tb-btn-sec { height: 40px; padding: 0 16px; }
</style>
</head>
<body>
<div class="screen">
  <aside class="sidebar" data-active="patients-list" data-role="caregiver"></aside>
  <div class="main">
    <div class="content">
      <div class="page-head">
        <div><div class="eyebrow">ผู้ป่วย</div><div class="h1">ข้อมูลผู้ป่วย</div><div class="sub">ผู้ป่วยภายใต้การดูแลทั้งหมด 6 ราย</div></div>
        <div class="actions"><span class="btn btn-primary add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>เพิ่มผู้ป่วยใหม่</span></div>
      </div>
      <div class="card table pt-table">
        <table>
          <tr><th>ผู้ป่วย</th><th>อายุ</th><th>ห้องพัก</th><th>โรคประจำตัว</th><th>อุปกรณ์รับเสียง</th><th class="right">จัดการ</th></tr>
          <!-- ROWS -->
        </table>
      </div>
    </div>
    <footer class="footer"></footer>
  </div>
</div>
<script>
  // Rows: same markup for every patient, avatar colour = avatarColors[i % 5] as in page.tsx.
  const EDIT_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#182433" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  const DEL_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b42323" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
  const PATIENTS = [
    ['ส', 'นายสมชาย ใจดี', 78, 'A-301', 'ความดันโลหิตสูง', 'AA:BB:CC:DD:EE:01', 'ไมค์หัวเตียง ห้อง A-301'],
    ['ม', 'นางสาวมานี สุขใจ', 72, 'B-205', 'เบาหวาน', 'AA:BB:CC:DD:EE:02', 'ไมค์หัวเตียง ห้อง B-205'],
    ['ส', 'นางสมศรี ทองดี', 81, 'A-105', 'โรคหัวใจ', 'AA:BB:CC:DD:EE:03', 'ไมค์ห้องน้ำ ห้อง A-105'],
    ['ส', 'นายสุรชัย พึ่งบุญ', 74, 'B-110', '—', 'AA:BB:CC:DD:EE:04', 'ไมค์หัวเตียง ห้อง B-110'],
    ['ว', 'นายวิชัย ศรีสุข', 69, 'C-102', 'อัมพฤกษ์ซีกซ้าย', 'AA:BB:CC:DD:EE:05', 'ไมค์หัวเตียง ห้อง C-102'],
    ['บ', 'นางบุญมี แก้วใส', 85, 'C-108', 'ความจำเสื่อม', 'AA:BB:CC:DD:EE:06', 'ไมค์หัวเตียง ห้อง C-108'],
  ];
  const rows = PATIENTS.map(([ini, name, age, room, cond, mac, dev], i) => `
          <tr><td><div class="cell-user"><span class="avatar av${(i % 5) + 1}">${ini}</span><span class="name">${name}</span></div></td><td style="white-space:nowrap">${age} ปี</td><td><span class="badge b-primary">${room}</span></td><td class="muted">${cond}</td><td><div class="dev"><span class="mono">${mac}</span><span class="muted">${dev}</span></div></td><td><div class="cell-actions"><span class="btn tb-btn-sec">${EDIT_SVG}แก้ไข</span><span class="btn tb-btn-sec danger">${DEL_SVG}ลบ</span></div></td></tr>`).join('');
  document.querySelector('.pt-table table').insertAdjacentHTML('beforeend', rows);

  // ?modal=edit shows PatientFormModal (mode="edit") opened for the first row.
  if (new URLSearchParams(location.search).get('modal') === 'edit') {
    document.title = 'Patients — แก้ไขข้อมูลผู้ป่วย (modal)';
    document.querySelector('.screen').insertAdjacentHTML('beforeend', `
    <div class="overlay"><div class="dialog">
      <div class="dialog-head"><div style="min-width:0"><div class="t">แก้ไขข้อมูลผู้ป่วย</div><div class="s">นายสมชาย ใจดี</div></div><span class="icon-btn"><i data-icon="x" data-size="20"></i></span></div>
      <div class="dialog-body">
        <div class="field"><label>ชื่อ-นามสกุล <span class="req">*</span></label><div class="input filled focus"><span class="grow">นายสมชาย ใจดี</span></div></div>
        <div class="two">
          <div class="field"><label>อายุ (ปี)</label><div class="input filled"><span class="grow">78</span></div></div>
          <div class="field"><label>เพศ</label><div class="input filled select"><span class="grow">ชาย</span><i data-icon="chevron-down" data-size="16"></i></div></div>
        </div>
        <div class="field"><label>หมายเลขห้อง/เตียง <span class="req">*</span></label><div class="input filled"><span class="grow">A-301</span></div></div>
        <div class="field"><label>โรคประจำตัว</label><div class="input filled"><span class="grow">ความดันโลหิตสูง</span></div></div>
        <div class="dev-box">
          <div class="lbl">อุปกรณ์ที่ผูกไว้</div>
          <div class="line"><span class="mono">AA:BB:CC:DD:EE:01</span><span class="muted">ไมค์หัวเตียง ห้อง A-301</span></div>
          <div class="hint2">เปลี่ยนอุปกรณ์ได้ที่หน้าลงทะเบียนผู้ป่วย</div>
        </div>
      </div>
      <div class="dialog-foot"><span class="btn tb-btn-sec">ยกเลิก</span><span class="btn btn-primary">บันทึก</span></div>
    </div></div>`);
  }
</script>
<script src="../assets/shell.js"></script>
</body>
</html>
