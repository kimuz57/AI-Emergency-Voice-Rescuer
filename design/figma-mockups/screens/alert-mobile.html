<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Alert (mobile) — แจ้งเตือนฉุกเฉิน</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* app/alert/page.tsx, status "alert", viewport < sm (640px) */
  .screen.mobile { background: var(--surface-2); padding: 24px 16px; justify-content: flex-start; align-items: center; }
  /* .alert-blink, frame at 0-49% of the 0.8 s cycle */
  .blink { position: absolute; inset: 0; background: rgba(239, 68, 68, .15); }

  .sos {
    position: relative; width: 100%; max-width: 448px;
    background: var(--surface); border-radius: 12px;
    border: 1px solid rgba(214, 57, 57, .4); border-top: 4px solid var(--danger);
    box-shadow: var(--shadow-pop);
  }
  .sos-head { padding: 24px 20px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .sos-icon {
    width: 64px; height: 64px; border-radius: 50%; margin-bottom: 16px;
    background: var(--danger-tint); color: var(--danger-text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 6px rgba(239, 68, 68, .18); /* alert-icon-pulse, mid frame */
  }
  .sos-badge {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px;
    padding: 4px 12px; border-radius: 999px;
    background: var(--danger); color: #fff;
    font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .025em;
  }
  .sos-badge .ping { position: relative; width: 8px; height: 8px; flex: none; }
  .sos-badge .ping::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; background: #fff; opacity: .35; }
  .sos-badge .ping::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #fff; }
  .sos-title { font-size: 24px; line-height: 32px; font-weight: 700; color: var(--danger-text); }

  .sos-body { padding: 0 20px 20px; }
  .info { border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
  .info-cap { padding: 16px 16px 0; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); }
  .info dl { padding: 0 16px 16px; }
  .info .item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .info .item.last { padding-bottom: 0; border-bottom: 0; }
  .info dt { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; color: var(--muted); }
  .info dt svg { flex: none; }
  .dd-name { margin-top: 4px; font-size: 24px; line-height: 1.375; font-weight: 700; color: var(--text); }
  .dd-room { margin-top: 6px; }
  .room-chip { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 8px; font-size: 20px; line-height: 28px; font-weight: 700; background: var(--primary-tint); color: var(--primary-text); }
  .dd-disease { margin-top: 4px; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--danger-text); }

  .audio-sec { padding: 16px; border-top: 1px solid var(--border); }
  .audio-cap { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text); }
  /* Chrome's native <audio controls> (light), h-12 */
  .native-audio { height: 48px; border-radius: 999px; background: #f1f3f4; display: flex; align-items: center; gap: 4px; padding: 0 8px; font-family: Roboto, "Inter", sans-serif; font-size: 13px; color: #1f1f1f; }
  .native-audio .ctl { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex: none; }
  .native-audio .time { padding: 0 6px; white-space: nowrap; }
  .native-audio .track { flex: 1; height: 4px; border-radius: 2px; background: rgba(0, 0, 0, .2); margin: 0 8px; position: relative; }
  .native-audio .track::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #1f1f1f; border-radius: 2px; }

  .sos-foot { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface); border-radius: 0 0 12px 12px; }
  .ack {
    width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    background: var(--danger); color: #fff; box-shadow: var(--shadow-xs);
    font-size: 18px; line-height: 28px; font-weight: 700;
  }
</style>
</head>
<body>
<div class="screen mobile">
  <div class="blink"></div>

  <div class="sos">
    <!-- หัวการ์ด -->
    <div class="sos-head">
      <div class="sos-icon"><i data-icon="siren" data-size="32"></i></div>
      <div class="sos-badge"><span class="ping"></span>SOS — แจ้งเตือนฉุกเฉิน</div>
      <div class="sos-title">ต้องการความช่วยเหลือด่วน!</div>
    </div>

    <!-- ส่วนแสดงข้อมูลผู้ป่วย -->
    <div class="sos-body">
      <div class="info">
        <p class="info-cap">ข้อมูลผู้ป่วย</p>
        <dl>
          <div class="item">
            <dt><i data-icon="user" data-size="16"></i>ชื่อ-สกุล:</dt>
            <dd class="dd-name">นายสมชาย ใจดี</dd>
          </div>
          <div class="item">
            <dt>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6776" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"/><path d="M2 20h20"/><path d="M14 12v.01"/></svg>
              ห้องพัก:
            </dt>
            <dd class="dd-room"><span class="room-chip">A-301</span></dd>
          </div>
          <div class="item last">
            <dt>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b6776" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>
              โรคประจำตัว:
            </dt>
            <dd class="dd-disease">ความดันโลหิตสูง</dd>
          </div>
        </dl>

        <!-- เครื่องเล่นไฟล์เสียง -->
        <div class="audio-sec">
          <p class="audio-cap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b42323" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            ฟังเสียงที่ตรวจจับได้:
          </p>
          <div class="native-audio">
            <span class="ctl"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1f1f1f"><polygon points="8 5 19 12 8 19 8 5"/></svg></span>
            <span class="time">0:00 / 0:02</span>
            <span class="track"></span>
            <span class="ctl"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1f1f1f"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
            <span class="ctl"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1f1f1f"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>
          </div>
        </div>
      </div>
    </div>

    <!-- ปุ่มยอมรับ -->
    <div class="sos-foot">
      <span class="ack">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        รับทราบและเข้าช่วยเหลือ
      </span>
    </div>
  </div>
</div>
<script src="../assets/shell.js"></script>
</body>
</html>
