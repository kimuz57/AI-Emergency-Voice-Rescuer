<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Admin — จัดการผู้ใช้งาน</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* Page-only rules: sizes follow the Tailwind classes in
     frontend/app/admin/users/page.tsx (text-xs = 12/16, text-sm = 14/20). */
  .au-head .eyebrow { line-height: 16px; }
  .au-head .h1 { margin-top: 4px; line-height: 32px; }
  .au-head .sub { margin-top: 4px; line-height: 20px; }

  .au-table table { font-size: 14px; line-height: 20px; }
  .au-table th { line-height: 16px; white-space: nowrap; }
  .au-table td { padding: 16px 20px; }
  .au-table .avatar { font-size: 12px; font-weight: 700; }
  .au-table .cell-user { font-weight: 600; }
  .au-table .email { color: var(--muted); }
  .au-conn { display: flex; flex-wrap: wrap; gap: 6px; }
  .au-none { font-size: 12px; line-height: 16px; color: var(--muted); }

  /* pill = inline-flex gap-1.5 rounded-full px-2.5 py-0.5 text-xs font-semibold */
  .au-pill {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border-radius: 999px; padding: 2px 10px; font-size: 12px; line-height: 16px; font-weight: 600;
  }
  .au-pill .d { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .au-pill.success { background: var(--success-tint); color: var(--success-text); }
  .au-pill.success .d { background: var(--success-text); }
  .au-pill.danger { background: var(--danger-tint); color: var(--danger-text); }
  .au-pill.danger .d { background: var(--danger-text); }
  .au-pill.primary { background: var(--primary-tint); color: var(--primary-text); }
  .au-pill.plain { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

  /* btnSecondary = h-9 px-3 gap-1.5 border-[--tb-border] bg-surface text-sm font-semibold */
  .au-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; white-space: nowrap; }
  .au-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap;
  }
  .au-btn.danger { color: var(--danger-text); }
  .au-btn.h40 { height: 40px; }
  .au-btn.fill { flex: 1; }
  .au-btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 16px; border-radius: 8px; flex: 1;
    background: var(--primary); color: #fff; font-size: 14px; line-height: 20px; font-weight: 600; box-shadow: var(--shadow-xs);
  }
  .au-btn-danger {
    display: inline-flex; align-items: center; justify-content: center;
    height: 40px; padding: 0 16px; border-radius: 8px; flex: 1;
    background: var(--danger); color: #fff; font-size: 14px; line-height: 20px; font-weight: 600;
  }
  /* btnDisconnect = h-8 px-2.5 border-[--tb-border] text-xs font-semibold text-danger */
  .au-btn-disconnect {
    display: inline-flex; align-items: center; justify-content: center;
    height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--danger-text); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap;
  }

  /* modals: bg-black/40 backdrop-blur-sm */
  .au-overlay { position: absolute; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 0 16px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .au-dialog { width: 448px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop); overflow: hidden; }
  .au-dialog-head { padding: 16px 24px; border-bottom: 1px solid var(--border); }
  .au-dialog-head h3 { font-size: 18px; line-height: 28px; font-weight: 700; color: var(--text); }
  .au-dialog-body { display: flex; flex-direction: column; gap: 16px; padding: 20px 24px; }
  .au-label { display: block; margin-bottom: 6px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text); }
  .au-input {
    height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--surface); box-shadow: var(--shadow-xs);
    display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: var(--text);
  }
  .au-input .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  .au-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .au-conn-list { border: 1px solid var(--border); border-radius: 8px; }
  .au-conn-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; min-height: 52px; }
  .au-conn-row + .au-conn-row { border-top: 1px solid var(--border); }
  .au-conn-name { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text); }
  .au-conn-name .d { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .au-dialog-foot { display: flex; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--border); background: var(--surface-2); }

  .au-confirm { width: 384px; padding: 24px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop); }
  .au-confirm .ic { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-bottom: 16px; border-radius: 50%; background: var(--danger-tint); }
  .au-confirm h3 { margin-bottom: 4px; font-size: 18px; line-height: 28px; font-weight: 700; color: var(--text); }
  .au-confirm p { margin-bottom: 24px; font-size: 14px; line-height: 20px; color: var(--muted); }
  .au-confirm .btns { display: flex; gap: 12px; }
</style>
</head>
<body>
<div class="screen">
  <aside class="sidebar" data-active="admin-users" data-role="admin"></aside>
  <div class="main">
    <div class="content">
      <div class="page-head au-head">
        <div>
          <div class="eyebrow">ผู้ดูแลระบบ</div>
          <div class="h1">จัดการผู้ใช้งาน (Users)</div>
          <div class="sub">รายชื่อผู้ใช้งานทั้งหมดในระบบ แอดมินสามารถแก้ไขสิทธิ์ ลบการเชื่อมต่อ และลบบัญชีได้</div>
        </div>
      </div>
      <div class="card table au-table">
        <table>
          <thead>
            <tr><th>ผู้ใช้งาน</th><th>อีเมล</th><th>สถานะยืนยัน</th><th>การเชื่อมต่อ</th><th>สิทธิ์ (Role)</th><th class="right">จัดการ</th></tr>
          </thead>
          <tbody id="au-rows"></tbody>
        </table>
      </div>
    </div>
    <footer class="footer"></footer>
  </div>
</div>
<script>
  // Edit icon and trash icon are the exact inline SVGs from page.tsx, with the
  // resolved colour written in (no currentColor).
  const EDIT = (c) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
  const TRASH = (c) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
  const TEXT = '#182433', DANGER_TEXT = '#b42323';

  // [name, email, verified, line, telegram, role]
  // Avatar = name.charAt(0).toUpperCase(), colour = avatarColors[i % 5] (av1..av5).
  const USERS = [
    ['ผู้ดูแลระบบ', 'admin@example.com', true, true, false, 'admin'],
    ['คุณดวงใจ รักษ์ดี', 'duangjai@example.com', true, true, true, 'caregiver'],
    ['ปกรณ์ ใจกว้าง', 'pakorn@example.com', true, false, true, 'caregiver'],
    ['ศิริพร มีสุข', 'siriporn@example.com', false, false, false, 'caregiver'],
    ['อนันต์ พากเพียร', 'anan@example.com', true, true, false, 'caregiver'],
  ];
  document.getElementById('au-rows').innerHTML = USERS.map(([name, email, verified, line, tg, role], i) => `
    <tr>
      <td><div class="cell-user"><span class="avatar av${(i % 5) + 1}">${name.charAt(0).toUpperCase()}</span><span>${name}</span></div></td>
      <td class="email">${email}</td>
      <td>${verified
        ? '<span class="au-pill success"><span class="d"></span>ยืนยันแล้ว</span>'
        : '<span class="au-pill danger"><span class="d"></span>ยังไม่ยืนยัน</span>'}</td>
      <td><div class="au-conn">${line ? '<span class="au-pill success">LINE</span>' : ''}${tg ? '<span class="au-pill primary">TG</span>' : ''}${!line && !tg ? '<span class="au-none">-</span>' : ''}</div></td>
      <td><span class="au-pill ${role === 'admin' ? 'primary' : 'plain'}">${role}</span></td>
      <td><div class="au-actions"><span class="au-btn">${EDIT(TEXT)}แก้ไข</span><span class="au-btn danger">${TRASH(DANGER_TEXT)}ลบ</span></div></td>
    </tr>`).join('');

  // admin-users.html?modal=edit   -> edit dialog (คุณดวงใจ, LINE + Telegram connected)
  // admin-users.html?modal=delete -> delete confirmation
  const modal = new URLSearchParams(location.search).get('modal');
  const CHEVRON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${TEXT}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
  if (modal === 'edit') {
    document.title = 'Admin — แก้ไขข้อมูลผู้ใช้งาน (modal)';
    document.querySelector('.screen').insertAdjacentHTML('beforeend', `
    <div class="au-overlay"><div class="au-dialog">
      <div class="au-dialog-head"><h3>แก้ไขข้อมูลผู้ใช้งาน</h3></div>
      <div class="au-dialog-body">
        <div><label class="au-label">ชื่อ-นามสกุล</label><div class="au-input"><span class="grow">คุณดวงใจ รักษ์ดี</span></div></div>
        <div><label class="au-label">อีเมล</label><div class="au-input"><span class="grow">duangjai@example.com</span></div></div>
        <div class="au-grid2">
          <div><label class="au-label">การยืนยันอีเมล</label><div class="au-input"><span class="grow">ยืนยันแล้ว</span>${CHEVRON}</div></div>
          <div><label class="au-label">สิทธิ์ (Role)</label><div class="au-input"><span class="grow">Caregiver</span>${CHEVRON}</div></div>
        </div>
        <div>
          <p class="au-label">การเชื่อมต่อแจ้งเตือน</p>
          <div class="au-conn-list">
            <div class="au-conn-row"><span class="au-conn-name"><span class="d" style="background:#2fb344"></span>LINE</span><span class="au-btn-disconnect">ยกเลิกการเชื่อมต่อ</span></div>
            <div class="au-conn-row"><span class="au-conn-name"><span class="d" style="background:#066fd1"></span>Telegram</span><span class="au-btn-disconnect">ยกเลิกการเชื่อมต่อ</span></div>
          </div>
        </div>
      </div>
      <div class="au-dialog-foot"><span class="au-btn h40 fill">ยกเลิก</span><span class="au-btn-primary">บันทึกข้อมูล</span></div>
    </div></div>`);
  } else if (modal === 'delete') {
    document.title = 'Admin — ยืนยันการลบผู้ใช้งาน (modal)';
    document.querySelector('.screen').insertAdjacentHTML('beforeend', `
    <div class="au-overlay"><div class="au-confirm">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${DANGER_TEXT}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></span>
      <h3>ยืนยันการลบผู้ใช้งาน</h3>
      <p>หากลบแล้วจะไม่สามารถกู้คืนบัญชีนี้ได้</p>
      <div class="btns"><span class="au-btn h40 fill">ยกเลิก</span><span class="au-btn-danger">ยืนยันลบ</span></div>
    </div></div>`);
  }
</script>
<script src="../assets/shell.js"></script>
</body>
</html>
