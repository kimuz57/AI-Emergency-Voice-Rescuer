# --- บังคับให้ใช้รหัสผ่าน ---
allow_anonymous true
password_file /mosquitto/config/passwd

# --- MQTT ปกติ ---
listener 1883 0.0.0.0

# --- เปิด WSS กลับมาอีกครั้ง (เอา # ออก) ---
listener 8083 0.0.0.0
protocol websockets

certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:AES256-SHA:AES128-SHA

# --- การตั้งค่าอื่นๆ ---
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all