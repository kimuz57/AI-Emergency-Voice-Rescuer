# --- บังคับให้ใช้รหัสผ่าน ---
allow_anonymous false
password_file /mosquitto/config/passwd

# --- ACL: จำกัดว่า user ไหน publish/subscribe topic ไหนได้ (S29) ---
# ตอนนี้ยังปิดอยู่: user ที่มีรหัสผ่านคนไหนก็ publish voice/audio/{MAC ใดก็ได้} ได้ (ปลอมเสียงของเครื่องอื่นได้)
# วิธีเปิด: copy acl.example เป็น acl (ไฟล์ /mosquitto/config/acl), แก้ชื่อ user ให้ตรงกับใน passwd แล้วเอา # ด้านล่างออก
# ⚠️ ห้ามเปิดบรรทัดนี้ก่อนตั้งค่า acl ให้ครบ: เมื่อมี acl_file แล้ว อะไรที่ไม่ได้อนุญาตไว้จะถูกปฏิเสธทั้งหมด
#    (ถ้าไฟล์ว่าง/ชื่อ user ไม่ตรง ทุก client รวมถึง ESP32 และ mqtt_audio_receiver จะ publish/subscribe ไม่ได้เลย)
# รายละเอียดดู mosquitto/README.md
# acl_file /mosquitto/config/acl

# --- 1. MQTT ปกติ (พอร์ต 1883) ---
listener 1883 0.0.0.0

# --- 2. Secure WebSocket / WSS (พอร์ต 8083) [ผูก Cert เฉพาะพอร์ตนี้] ---
listener 8083 0.0.0.0
protocol websockets
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# tls_version tlsv1.2
# ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:AES256-SHA:AES128-SHA

# --- 3. Plain WebSocket / WS (พอร์ต 9001) [ไม่ใช้ Cert] ---
listener 9001 0.0.0.0
protocol websockets

# --- การตั้งค่าอื่นๆ ---
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all